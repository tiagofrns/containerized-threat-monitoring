route:
  receiver: discard
  routes:
    - receiver: wazuh
      matchers:
        - bridge="wazuh"
        - alertname=~"AnalyticsClientImpact|DNSPolicyRejections"
      group_by: [alertname]
      group_wait: 2s
      group_interval: 30s
      repeat_interval: 5m
receivers:
  - name: discard
  - name: wazuh
    webhook_configs:
      - url: http://127.0.0.1:9095/alerts
        send_resolved: false
        http_config:
          authorization:
            credentials_file: /etc/prometheus/alert-bridge-secret
